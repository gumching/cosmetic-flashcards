['a8','A','烟酰胺(维生素B3)','NIACINAMIDE','淋洗5%/驻留5%','','',''],
['t1','T','卡波姆','CARBOMER','淋洗5%/驻留4%','','',''],
['t2','T','黄原胶','XANTHAN GUM','淋洗5%/驻留3%','','',''],
['t3','T','羟乙基纤维素','HYDROXYETHYLCELLULOSE','淋洗5%/驻留5%','','',''],
['t4','T','丙烯酸(酯)类/C10-30烷醇丙烯酸酯交联聚合物','ACRYLATES/C10-30 ALKYL ACRYLATE CROSSPOLYMER','驻留2%','','',''],
['t5','T','鲸蜡硬脂醇','CETEARYL ALCOHOL','淋洗25%/驻留20%','','',''],
['t6','T','硬脂酸','STEARIC ACID','淋洗20%/驻留15%','','','']
];
for(var k=0;k<raw.length;k++){
  var r=raw[k];
  D.push({i:r[0],c:r[1],n:r[2],e:r[3],x:r[4],s:r[5],r:r[6],l:r[7]});
}
})();

var CL={P:'准用防腐剂',S:'准用防晒剂',R:'限用组分',M:'保湿剂',F:'表面活性剂',E:'乳化剂',A:'抗氧化剂',T:'增稠剂'};
var CT={P:'tP',S:'tS',R:'tR',M:'tM',F:'tF',E:'tE',A:'tA',T:'tT'};
var list=[];
var idx=0;
var flipped=false;
var marks={};
var stars={};

function shuffle(a){
  var b=a.slice();
  for(var i=b.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=b[i];b[i]=b[j];b[j]=t;
  }
  return b;
}

function doSearch(){
  var cat=document.getElementById('J_cat').value;
  var q=document.getElementById('J_q').value.trim().toLowerCase();
  list=[];
  for(var k=0;k<D.length;k++){
    var d=D[k];
    if(cat && d.c!==cat) continue;
    if(q && d.n.toLowerCase().indexOf(q)===-1 && d.e.toLowerCase().indexOf(q)===-1) continue;
    list.push(d);
  }
  if(!q) list=shuffle(list);
  idx=0;
  flipped=false;
  show();
}

function doReset(){
  document.getElementById('J_q').value='';
  document.getElementById('J_cat').value='';
  doSearch();
}

function doShuffle(){
  list=shuffle(list);
  idx=0;
  flipped=false;
  show();
}

function show(){
  var box=document.getElementById('J_ci');
  var info=document.getElementById('J_info');
  if(!list.length){
    box.innerHTML='<p style="text-align:center;color:#999;font-size:1rem">没有匹配的原料</p>';
    info.textContent='0 / 0';
    return;
  }
  var d=list[idx];
  var h='';
  h+='<span class="tag '+CT[d.c]+'">'+CL[d.c]+'</span>';

  if(!flipped){
    h+='<p class="cn">'+d.n+'</p>';
    h+='<p class="tip" style="margin-top:20px;font-size:.85rem;color:#94a3b8">&#128073; 点击卡片查看详情</p>';
  } else {
    h+='<p class="cn" style="font-size:1.15rem">'+d.n+'</p>';
    h+='<p class="en">'+d.e+'</p>';
    h+='<button class="speak" onclick="event.stopPropagation();doSpeak()">&#128266; 朗读INCI(美式)</button>';
    if(d.x){h+='<div class="dt"><div class="dt-l">最大允许浓度</div><div class="dt-v">'+d.x+'</div></div>';}
    if(d.s){h+='<div class="dt"><div class="dt-l">使用范围</div><div class="dt-v">'+d.s+'</div></div>';}
    if(d.r){h+='<div class="dt"><div class="dt-l">限制条件</div><div class="dt-v">'+d.r+'</div></div>';}
    if(d.l){h+='<div class="dt"><div class="dt-l">标签必须标印</div><div class="dt-v warn">'+d.l+'</div></div>';}
    var tip=getTip(d);
    if(tip){h+='<div class="dt sep"><div class="dt-l">记忆提示</div><div class="dt-v purple">'+tip+'</div></div>';}
    h+='<p class="tip">&#128073; 再次点击进入下一张</p>';
  }
  box.innerHTML=h;
  info.textContent=(idx+1)+' / '+list.length;
  document.getElementById('J_star').className=stars[d.i]?'bs on':'bs';
  updS();
}

function getTip(d){
  var t=[];
  if(d.e.indexOf('PARABEN')>=0) t.push('尼泊金=对羟基苯甲酸酯,按碳链分甲乙丙丁酯');
  if(d.e.indexOf('ISOTHIAZOLINONE')>=0) t.push('异噻唑啉酮类防腐剂,近年限制趋严');
  if(d.e==='PHENOXYETHANOL') t.push('目前最主流广谱防腐剂,安全性好');
  if(d.e.indexOf('SULFATE')>=0&&d.c==='F') t.push('阴离子表活,泡沫丰富但可能刺激');
  if(d.e.indexOf('GLUCOSIDE')>=0) t.push('APG烷基糖苷,天然来源温和表活');
  if(d.e.indexOf('GLUTAMATE')>=0) t.push('氨基酸表活,弱酸性非常温和');
  if(d.e==='TITANIUM DIOXIDE'||d.e==='ZINC OXIDE') t.push('物理防晒剂,反射散射紫外线');
  if(d.e.indexOf('BENZOPHENONE')>=0) t.push('二苯酮类化学防晒,吸收UVA+UVB');
  if(d.e.indexOf('METHOXYCINNAMATE')>=0) t.push('肉桂酸酯类化学防晒,主吸收UVB');
  if(d.e.indexOf('HYALURONATE')>=0) t.push('玻尿酸=透明质酸,吸附自身1000倍水分');
  if(d.e.indexOf('CERAMIDE')>=0) t.push('神经酰胺=皮肤屏障核心脂质成分');
  if(d.e==='SQUALANE') t.push('角鲨烷=皮脂类似物,亲肤封闭润肤');
  if(d.e==='RETINOL') t.push('VA醇促细胞更新抗老,注意避光和耐受');
  if(d.e==='NIACINAMIDE') t.push('VB3全能成分:美白+控油+修护屏障');
  if(d.e.indexOf('ASCORBIC')>=0) t.push('VC类抗氧化美白,注意稳定性');
  if(d.e==='CARBOMER') t.push('卡波姆需碱(TEA/NaOH)中和才能增稠');
  if(d.e==='GLYCERIN') t.push('最经典小分子保湿剂,强吸湿性');
  if(d.e.indexOf('POLYSORBATE')>=0) t.push('吐温系列非离子O/W乳化剂');
  if(d.e.indexOf('SORBITAN')>=0) t.push('司盘系列W/O乳化剂,常与吐温配合');
  if(d.e.indexOf('TRICLOSAN')>=0) t.push('三氯生争议大,多国已限制或禁用');
  if(d.l&&d.l.indexOf('儿童')>=0) t.push('重点:婴幼儿产品禁用/限用');
  return t.join('; ');
}

function doSpeak(){
  if(!list.length) return;
  var text=list[idx].e;
  try{
    var audio=document.getElementById('J_audio');
    if(!audio){
      audio=document.createElement('audio');
      audio.id='J_audio';
      document.body.appendChild(audio);
    }
    audio.src='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(text)+'&type=2';
    audio.play().catch(function(){
      if(window.speechSynthesis){
        var u=new SpeechSynthesisUtterance(text);
        u.lang='en-US';u.rate=0.75;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      }
    });
  }catch(ex){
    if(window.speechSynthesis){
      var u=new SpeechSynthesisUtterance(text);
      u.lang='en-US';u.rate=0.75;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }
  }
}

function flipOrNext(){
  if(!list.length) return;
  if(flipped){goNext();}
  else{flipped=true;show();}
}

function goNext(){if(idx<list.length-1){idx++;flipped=false;show();}}
function goPrev(){if(idx>0){idx--;flipped=false;show();}}

function doStar(){
  if(!list.length) return;
  var d=list[idx];
  stars[d.i]=!stars[d.i];
  show();
}

function doMark(v){
  if(!list.length) return;
  marks[list[idx].i]=v;
  goNext();
}

function updS(){
  var k=0,u=0,f=0,s=0;
  for(var id in marks){if(marks[id]===1)k++;else if(marks[id]===2)u++;else if(marks[id]===3)f++;}
  for(var id in stars){if(stars[id])s++;}
  document.getElementById('J_n1').textContent=list.length;
  document.getElementById('J_n2').textContent=k;
  document.getElementById('J_n3').textContent=u;
  document.getElementById('J_n4').textContent=f;
  document.getElementById('J_n5').textContent=s;
}

document.getElementById('J_cat').onchange=doSearch;

document.onkeydown=function(ev){
  var t=ev.target.tagName;
  if(t==='INPUT'||t==='SELECT') return;
  var k=ev.key;
  if(k==='ArrowRight') goNext();
  else if(k==='ArrowLeft') goPrev();
  else if(k===' '){ev.preventDefault();flipOrNext();}
  else if(k==='s'||k==='S') doSpeak();
  else if(k==='1') doMark(1);
  else if(k==='2') doMark(2);
  else if(k==='3') doMark(3);
  else if(k==='f'||k==='F') doStar();
};

if(window.speechSynthesis) try{speechSynthesis.getVoices();}catch(e){}
doSearch();
</script>
</body>
</html>
