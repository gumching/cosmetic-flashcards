<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="referrer" content="no-referrer">
<title>化妆品原料学习翻卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:15px}
h1{text-align:center;color:#fff;font-size:1.4rem;margin-bottom:4px}
.sub{text-align:center;color:rgba(255,255,255,.75);font-size:.72rem;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.bar select,.bar input,.bar button{padding:8px 12px;border:none;border-radius:8px;font-size:.84rem;outline:none}
.bar select{background:#fff;cursor:pointer;max-width:130px}
.bar input{background:#fff;flex:1;min-width:120px;max-width:200px}
.bar button{cursor:pointer;background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.4)}
.bar button:active{background:rgba(255,255,255,.5)}
.info{text-align:center;color:rgba(255,255,255,.8);font-size:.78rem;margin-bottom:10px}
.wrap{display:flex;justify-content:center;margin-bottom:12px}
.card{width:100%;max-width:520px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.22);overflow:hidden;cursor:pointer;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.card:active{opacity:.95}
.ci{padding:22px 20px;min-height:300px;display:flex;flex-direction:column;justify-content:center}
.tag{display:inline-block;padding:3px 10px;border-radius:14px;font-size:.68rem;font-weight:600;color:#fff;margin-bottom:8px;align-self:center}
.tP{background:#10b981}.tS{background:#f59e0b}.tR{background:#ef4444}.tG{background:#6b7280}
.cn{font-size:1.4rem;font-weight:700;text-align:center;margin-bottom:6px;color:#1e293b}
.en{font-size:.88rem;color:#6366f1;font-style:italic;text-align:center;margin-bottom:8px;word-break:break-all}
.audio-box{text-align:center;margin:8px 0}
.audio-box audio{width:90%;max-width:280px;height:36px}
.tip{text-align:center;font-size:.72rem;color:#aaa;margin-top:8px}
.dt{margin-bottom:8px}
.dt-l{font-size:.68rem;font-weight:600;color:#6366f1;margin-bottom:2px}
.dt-v{font-size:.82rem;line-height:1.4;color:#334155}
.warn{color:#dc2626;font-weight:600}
.sep{border-top:1px solid #e2e8f0;padding-top:10px;margin-top:8px}
.nav{display:flex;justify-content:center;gap:14px;margin-bottom:10px}
.nav button{width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:1.2rem;cursor:pointer;touch-action:manipulation}
.nav button:active{background:rgba(255,255,255,.5)}
.acts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.acts button{padding:9px 16px;border-radius:16px;border:none;font-size:.84rem;cursor:pointer;touch-action:manipulation}
.bk{background:#4ade80;color:#065f46}.bu{background:#fbbf24;color:#78350f}.bf{background:#f87171;color:#7f1d1d}
.bs{background:rgba(255,255,255,.15);color:#fbbf24;font-size:1rem;border:1px solid rgba(255,255,255,.3)}
.bs.on{background:#fbbf24;color:#fff}
.stats{display:flex;justify-content:space-around;flex-wrap:wrap;gap:6px;max-width:600px;margin:0 auto 10px;background:rgba(255,255,255,.1);border-radius:10px;padding:8px}
.st{text-align:center;color:#fff}.st b{display:block;font-size:1.1rem}.st span{font-size:.66rem;opacity:.8}
.keys{text-align:center;color:rgba(255,255,255,.5);font-size:.66rem}
</style>
</head>
<body>
<h1>化妆品原料学习翻卡</h1>
<p class="sub">基于《化妆品安全技术规范(2015版)》与《已使用化妆品原料目录(2021版)》 共8985条</p>
<div class="bar">
<select id="J_cat"><option value="">全部分类</option><option value="P">准用防腐剂</option><option value="S">准用防晒剂</option><option value="R">限用组分</option><option value="G">通用原料</option></select>
<input id="J_q" placeholder="输入中文/INCI关键词">
<button onclick="doSearch()">搜索</button>
<button onclick="doReset()">重置</button>
</div>
<div class="info" id="J_info">-</div>
<div class="wrap"><div class="card" onclick="flipOrNext()"><div class="ci" id="J_ci">加载中...</div></div></div>
<div class="nav"><button onclick="goPrev()">&#9664;</button><button onclick="doShuffle()">&#128256;</button><button onclick="goNext()">&#9654;</button></div>
<div class="acts">
<button class="bs" id="J_star" onclick="doStar()">&#9733;</button>
<button class="bk" onclick="doMark(1)">&#10003; 已掌握</button>
<button class="bu" onclick="doMark(2)">~ 不确定</button>
<button class="bf" onclick="doMark(3)">&#10007; 未掌握</button>
</div>
<div class="stats"><div class="st"><b id="J_n1">0</b><span>结果数</span></div><div class="st"><b id="J_n2">0</b><span>已掌握</span></div><div class="st"><b id="J_n3">0</b><span>不确定</span></div><div class="st"><b id="J_n4">0</b><span>未掌握</span></div><div class="st"><b id="J_n5">0</b><span>收藏</span></div></div>
<p class="keys">快捷键: ←→翻页 | 空格翻卡 | 1已掌握 2不确定 3未掌握 | F收藏</p>
<script src="data.js"></script>
<script>
var D=[];
(function(){
  for(var k=0;k<RAW.length;k++){
    var r=RAW[k];
    D.push({n:r[0],e:r[1],c:r[2],x:r[3],s:r[4],r:r[5],l:r[6],t:r[7]});
  }
})();

var CL={P:'准用防腐剂',S:'准用防晒剂',R:'限用组分',G:'通用原料'};
var CT={P:'tP',S:'tS',R:'tR',G:'tG'};
var list=[];
var idx=0;
var flipped=false;
var marks={};
var stars={};

function shuffle(a){
  var b=a.slice();
  for(var i=b.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=b[i];b[i]=b[j];b[j]=t;
  }
  return b;
}

function doSearch(){
  var cat=document.getElementById('J_cat').value;
  var q=document.getElementById('J_q').value.trim().toLowerCase();
  list=[];
  if(!q){
    for(var k=0;k<D.length;k++){
      var d=D[k];
      if(cat && d.c!==cat) continue;
      list.push(d);
    }
    if(list.length>200) list=shuffle(list).slice(0,200);
    else list=shuffle(list);
  } else {
    var exact=[];
    var startsWith=[];
    var contains=[];
    for(var k=0;k<D.length;k++){
      var d=D[k];
      if(cat && d.c!==cat) continue;
      var cn=d.n.toLowerCase();
      var en=d.e.toLowerCase();
      if(cn===q || en===q){
        exact.push(d);
      } else if(cn.indexOf(q)===0 || en.indexOf(q)===0){
        startsWith.push(d);
      } else if(cn.indexOf(q)>=0 || en.indexOf(q)>=0){
        contains.push(d);
      }
    }
    list=exact.concat(startsWith).concat(contains);
  }
  idx=0;
  flipped=false;
  show();
}

function doReset(){
  document.getElementById('J_q').value='';
  document.getElementById('J_cat').value='';
  doSearch();
}

function doShuffle(){
  if(list.length>1){
    list=shuffle(list);
    idx=0;
    flipped=false;
    show();
  }
}

function show(){
  var box=document.getElementById('J_ci');
  var info=document.getElementById('J_info');
  if(!list.length){
    box.innerHTML='<p style="text-align:center;color:#999;font-size:1rem">没有匹配的原料</p>';
    info.textContent='0 / 0';
    return;
  }
  var d=list[idx];
  var h='';
  h+='<span class="tag '+CT[d.c]+'">'+CL[d.c]+'</span>';

  if(!flipped){
    h+='<p class="cn">'+d.n+'</p>';
    if(d.x){h+='<p style="text-align:center;font-size:.75rem;color:#94a3b8;margin-top:4px">最高使用量: '+d.x+'</p>';}
    h+='<p class="tip" style="margin-top:16px;font-size:.85rem;color:#94a3b8">&#128073; 点击卡片查看详情</p>';
  } else {
    h+='<p class="cn" style="font-size:1.1rem">'+d.n+'</p>';
    if(d.e){
      h+='<p class="en">'+d.e+'</p>';
      var ttsText=d.e;
      while(ttsText.indexOf('/')>=0) ttsText=ttsText.replace('/',' ');
      var t=encodeURIComponent(ttsText);
      h+='<div class="audio-box"><audio controls preload="none" referrerpolicy="no-referrer">';
      h+='<source src="https://fanyi.baidu.com/gettts?lan=en&text='+t+'&spd=3&source=web" type="audio/mpeg">';
      h+='<source src="https://tts.baidu.com/text2audio?tex='+t+'&cuid=dict&lan=en&ctp=1&pdt=30&vol=9&spd=4" type="audio/mpeg">';
      h+='</audio></div>';
    }
    if(d.x){h+='<div class="dt"><div class="dt-l">最大允许浓度/历史使用量</div><div class="dt-v">'+d.x+'</div></div>';}
    if(d.s){h+='<div class="dt"><div class="dt-l">使用范围</div><div class="dt-v">'+d.s+'</div></div>';}
    if(d.r){h+='<div class="dt"><div class="dt-l">限制条件</div><div class="dt-v">'+d.r+'</div></div>';}
    if(d.l){h+='<div class="dt"><div class="dt-l">标签必须标印</div><div class="dt-v warn">'+d.l+'</div></div>';}
    if(d.t){h+='<div class="dt"><div class="dt-l">备注</div><div class="dt-v">'+d.t+'</div></div>';}
    h+='<p class="tip">&#128073; 再次点击进入下一张</p>';
  }
  box.innerHTML=h;
  info.textContent=(idx+1)+' / '+list.length;
  document.getElementById('J_star').className=stars[d.n]?'bs on':'bs';
  updS();
}

function flipOrNext(){
  if(!list.length) return;
  if(flipped){goNext();}
  else{flipped=true;show();}
}

function goNext(){if(idx<list.length-1){idx++;flipped=false;show();}}
function goPrev(){if(idx>0){idx--;flipped=false;show();}}

function doStar(){
  if(!list.length) return;
  var d=list[idx];
  stars[d.n]=!stars[d.n];
  show();
}

function doMark(v){
  if(!list.length) return;
  marks[list[idx].n]=v;
  goNext();
}

function updS(){
  var k=0,u=0,f=0,s=0;
  for(var id in marks){if(marks[id]===1)k++;else if(marks[id]===2)u++;else if(marks[id]===3)f++;}
  for(var id in stars){if(stars[id])s++;}
  document.getElementById('J_n1').textContent=list.length;
  document.getElementById('J_n2').textContent=k;
  document.getElementById('J_n3').textContent=u;
  document.getElementById('J_n4').textContent=f;
  document.getElementById('J_n5').textContent=s;
}

document.getElementById('J_cat').onchange=doSearch;

document.onkeydown=function(ev){
  var t=ev.target.tagName;
  if(t==='INPUT'||t==='SELECT') return;
  var k=ev.key;
  if(k==='ArrowRight') goNext();
  else if(k==='ArrowLeft') goPrev();
  else if(k===' '){ev.preventDefault();flipOrNext();}
  else if(k==='1') doMark(1);
  else if(k==='2') doMark(2);
  else if(k==='3') doMark(3);
  else if(k==='f'||k==='F') doStar();
};

doSearch();
</script>
</body>
</html>
